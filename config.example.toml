# tfm configuration
# Location: ~/.config/tfm/config.toml (or $XDG_CONFIG_HOME/tfm/config.toml)
# Override path with $TFM_CONFIG. Missing file = all defaults.
# Invalid values are ignored per-key (falls back to default), never fatal.
# [keys]: every action can carry several binds. Bare letters/numbers are
# loadable here and in presets (bound bare keys navigate before the
# type-to-search catch-all); [ui] type-to-search=off stops unbound ones
# from filtering. The settings capture UI still reserves them.

[ui]
view-mode                             = "grid"      # "grid" = icon tiles; "list" = compact rows with size + modified columns
sidebar-width                         = 26          # 16..60 cells (grid + list)
preview-width                         = 40          # 20..80 cells
terminal-height                       = 12          # embedded terminal pane height in rows, 4..30 (applies live to the open pane)
tile-width                            = 20          # 10..40 cells (grid view)
tile-height                           = 5           # 3..10 cells (grid view)
icon-cells                            = 3           # grid icon height in rows, 1..5
word-wrap                             = false       # true = wrap long file names onto extra tile rows (grid view); false = single line cut with …
list-row-height                       = 1           # list view row height in cells, 1..3 (icon scales with it)
preview-enabled                       = false       # right-side preview pane (text files, folder stats)
dual-pane                             = false       # true = two independent file panes side by side (tab switches the active pane); false = single pane
sidebar-auto-hide                     = false       # true = collapse the places sidebar until the mouse nears its edge (see sidebar-collapse-style)
sidebar-collapse-style                = "hidden"    # "rail" = icon-only strip; "hidden" = width 0; "min" = shrink to a sliver
preview-auto-hide                     = false       # true = collapse the preview pane until the mouse nears the right edge
preview-collapse-style                = "hidden"    # "rail" = narrow strip; "hidden" = width 0; "min" = shrink to a sliver
terminal-auto-hide                    = false       # true = the open terminal pane collapses to its header until the mouse nears the bottom edge (the shell stays alive)
terminal-collapse-style               = "hidden"    # "header" = keep the title row visible; "hidden" = height 0
hover-zone-cells                      = 8           # cells from the edge that trigger an auto-hide expand, 1..8
hover-open-delay-ms                   = 195         # delay before an auto-hide panel expands, 0..1000 ms
hover-close-delay-ms                  = 175         # delay before an auto-hide panel collapses (anti-flicker), 0..2000 ms
hover-anim-ms                         = 120         # auto-hide slide duration, 0..600 ms (0 = instant)
type-to-search                        = true        # true = typing filters the folder (bare keys); false = bare keys never filter (yazi preset flips it off, startSearch re-arms on demand)
double-click-ms                       = 400         # 100..2000
drag-threshold-cells                  = 1           # cells of movement before a press becomes a drag, 1..5
gpm-mouse                             = true        # true = read mouse events from the gpm daemon on a Linux text console (no-op off a console or without gpm)
toast-duration-ms                     = 3000        # how long notifications stay up, 1000..10000
follow-terminal                       = false       # true = build the theme from the terminal's own colors (OSC fg/bg + palette; picked as the System theme row) instead of a fixed preset
transparent-bg                        = false       # true = follow a transparent terminal bg (kitty background_opacity); false = force opaque
icons                                 = "opaque"    # "opaque" = icons flattened onto the tile bg (default); "transparent" = rasters keep alpha (may fringe on some terminals); "transparent-partial" = transparent except inside floating menus/dialogs
ui-style                              = "solid"     # "solid" = filled panels; "outline" = rounded borders, no panel fills at rest; "outline-partial" = outline chrome, solid floating panels
sidebar-title                         = true        # true = show the ASCII "tfm" logo at the top of the places sidebar; false = hide it
tab-bar                               = false       # true = strip always visible (even with one tab); false = adaptive (only while 2+ tabs are open)
file-animation                        = false       # true = animate files appearing in the content area (style derived from file-animation-slide + file-animation-stagger)
file-animation-slide                  = false       # true = files rise up into place (distance = file-animation-slide-pct)
file-animation-stagger                = false       # true = top-to-bottom cascade instead of one wave
file-animation-ms                     = 180         # content-area file animation duration, 0..800 ms (0 = instant)
file-animation-stagger-pct            = 40          # how spread the cascade wave is, 0..300% (0 = all tiles at once; over 100 = the wave outlives the duration)
file-animation-slide-pct              = 70          # how far files slide, 0..150% of the viewport (0 = fade in place; clamped to whole cells)
file-animation-slide-dir              = "up"        # "up"/"down" = files rise/drop vertically; "left"/"right" = files slide in horizontally
file-animation-ease                   = "ease-out"  # "linear" = constant velocity; "ease-out" = fast start, soft landing; "ease-in-out" = soft both ends
file-animation-container-fade         = true        # true = fade the grid as one layer instead of per tile (same look, one opacity update per frame instead of one per file)
file-animation-visible-only           = true        # true = only animate the files inside the viewport; off-screen files appear instantly (keeps very large folders cheap)
file-animation-row-granularity        = true        # true = cascades animate grid rows instead of each file (same look at a distance, far cheaper on huge folders; tiles in one row appear together)
file-animation-max-files              = 2000        # skip the file animation entirely above this many files (any animation frame re-walks the whole grid render list, huge folders jank; 0 = never skip)
file-animation-scroll-reveal-delay-ms = 0           # wait for scroll to settle this long before playing the scroll-reveal (0 = play every notch; higher = one wave per pause: cheaper on huge folders and the wave actually completes visibly)
windowed-grid                         = true        # true = render only the visible rows (plus overscan) of a folder, sliding as you scroll (huge folders stop rebuilding/relaying thousands of off-screen tiles; selection and search still see every file)
listings-cache                        = true        # true = reuse a folder's file list across repaints until the folder itself changes (back/forward and selection changes skip the disk; some network/fuse mounts freeze the folder timestamp, so entries refresh after ~2s regardless)
listings-cache-stats                  = true        # true = keep file sizes/dates inside the cached folder listing too, so size/date sorts stop re-stating every file on every repaint (displayed stats can lag a live edit by up to the cache ttl)
listings-cache-ttl                    = 2           # seconds a cached folder listing may serve possibly-stale sizes/dates (or files at all on mounts whose folder timestamps freeze) before re-reading; 1 = freshest, 300 = best on slow network mounts
file-hover-animation                  = false       # true = hover nudges the tile icon one cell in the lift direction (rest layout unchanged; up skips the top row, tiles without room keep the highlight only)
file-hover-include-label              = false       # true = the filename rides along with the hover lift
file-hover-direction                  = "up"        # "up"/"down" = the icon rises/drops vertically; "left"/"right" = it nudges horizontally
sidebar-animation                     = false       # true = animate the places sidebar on boot (style = sidebar-animation-style)
sidebar-animation-style               = "fade"      # "fade" = the whole sidebar fades in; "slide" = it slides in from the edge; "stagger" = places rows cascade in; "stagger-slide" = each row slides+fades in, files-style
sidebar-animation-ms                  = 180         # sidebar intro duration, 0..800 ms (0 = instant)
sidebar-animation-slide-cells         = 8           # how far the sidebar slides in, 0..32 cells (0 = fade in place)
sidebar-animation-slide-dir           = "left"      # "left"/"right" = slides in horizontally from the edge; "up"/"down" = slides vertically
sidebar-animation-stagger-pct         = 40          # how spread the sidebar cascade is, 0..300% (0 = all rows at once)
sidebar-animation-ease                = "ease-out"  # "linear" = constant velocity; "ease-out" = fast start, soft landing; "ease-in-out" = soft both ends
sidebar-animation-include-title       = false       # true = the sidebar title joins the boot cascade first (stagger/stagger-slide only; fade/slide already move it with the whole panel)
sidebar-hover-animation               = false       # true = hovering a sidebar row nudges its icon one cell (rest layout unchanged; the cwd-selected row keeps its paint only)
sidebar-hover-include-label           = false       # true = the row label rides along with the hover nudge
sidebar-hover-direction               = "left"      # "left" = the icon nudges into the row padding; "right" = it nudges toward the label
topbar-animation                      = false       # true = cascade each top bar button + crumb in on boot (style = topbar-animation-style)
topbar-animation-style                = "fade"      # "fade" = all items fade in together; "slide" = they slide in from the edge as one wave; "stagger" = buttons + crumbs cascade left-to-right; "stagger-slide" = each item slides+fades in, files-style
topbar-animation-ms                   = 180         # top bar intro duration, 0..800 ms (0 = instant)
topbar-animation-slide-cells          = 8           # how far the top bar slides in, 0..32 cells (0 = fade in place)
topbar-animation-slide-dir            = "down"      # "down"/"up" = slides in vertically from the edge; "left"/"right" = slides horizontally
topbar-animation-stagger-pct          = 40          # how spread the item cascade is, 0..300% (0 = all items at once)
topbar-animation-ease                 = "ease-out"  # "linear" = constant velocity; "ease-out" = fast start, soft landing; "ease-in-out" = soft both ends
directory-bar-animation               = false       # true = rebuilt crumbs cascade in on every directory change (not just boot)
directory-bar-style                   = "stagger"   # "stagger" = crumbs cascade in left-to-right; "fade"/"slide" = one wave; "stagger-slide" = each crumb slides+fades in, files-style
directory-bar-ms                      = 180         # directory bar animation duration, 0..800 ms (0 = instant)
directory-bar-slide-cells             = 8           # how far crumbs slide in, 0..32 cells (0 = fade in place)
directory-bar-dir                     = "right"     # "right"/"left" = crumbs slide in horizontally; "down"/"up" = slides vertically
directory-bar-stagger-pct             = 40          # how spread the crumb cascade is, 0..300% (0 = all crumbs at once)
directory-bar-ease                    = "ease-out"  # "linear" = constant velocity; "ease-out" = fast start, soft landing; "ease-in-out" = soft both ends
show-hidden                           = false       # start with dotfiles visible (ctrl+h toggles at runtime)
recursive-search                      = false       # true = type-to-search also looks inside subfolders (fd when installed, built-in walk otherwise)
restore-session                       = false       # true = reopen the folder from the last quit instead of the launch cwd
persist-undo                          = false       # true = undo history survives restarts (journal under $XDG_STATE_HOME/tfm/, entries expire after 7 days)
show-launch-time                      = false       # true = show a notification with the app launch time in ms (debug aid); also enabled by --debug

[theme]
bg             = "#1a1b26"  # background
sidebarBg      = "#16161e"  # sidebar background
sidebarFg      = "#c0caf5"  # sidebar text
sidebarFgMuted = "#565f89"  # sidebar muted text
accent         = "#7aa2f7"  # accent
accentBg       = "#292e42"  # accent background (selection, buttons)
hoverBg        = "#24283b"  # hover background
border         = "#292e42"  # borders
divider        = "#292e42"  # dividers
white          = "#c0caf5"  # primary text
syntaxString   = "#9ece6a"  # syntax: strings
syntaxNumber   = "#ff9e64"  # syntax: numbers
syntaxType     = "#2ac3de"  # syntax: types
syntaxFunction = "#7aa2f7"  # syntax: functions
syntaxOperator = "#89ddff"  # syntax: operators
syntaxProperty = "#73daca"  # syntax: properties
ansi0          = "#16161e"  # terminal color 0 (black)
ansi1          = "#f7768e"  # terminal color 1 (red)
ansi2          = "#9ece6a"  # terminal color 2 (green)
ansi3          = "#e0af68"  # terminal color 3 (yellow)
ansi4          = "#7aa2f7"  # terminal color 4 (blue)
ansi5          = "#bb9af7"  # terminal color 5 (magenta)
ansi6          = "#7dcfff"  # terminal color 6 (cyan)
ansi7          = "#c0caf5"  # terminal color 7 (white)
ansi8          = "#565f89"  # terminal color 8 (bright black)
ansi9          = "#f7768e"  # terminal color 9 (bright red)
ansi10         = "#9ece6a"  # terminal color 10 (bright green)
ansi11         = "#e0af68"  # terminal color 11 (bright yellow)
ansi12         = "#7aa2f7"  # terminal color 12 (bright blue)
ansi13         = "#bb9af7"  # terminal color 13 (bright magenta)
ansi14         = "#7dcfff"  # terminal color 14 (bright cyan)
ansi15         = "#c0caf5"  # terminal color 15 (bright white)

[keys]
quit               = ["ctrl+q"]                  # default: ctrl+q
restart            = ["ctrl+alt+r"]              # default: ctrl+alt+r
open-menu          = ["escape"]                  # default: escape
new-tab            = ["ctrl+t"]                  # default: ctrl+t
close-tab          = ["ctrl+w"]                  # default: ctrl+w
next-tab           = ["ctrl+tab"]                # default: ctrl+tab
prev-tab           = ["ctrl+shift+tab"]          # default: ctrl+shift+tab
select-all         = ["ctrl+a"]                  # default: ctrl+a
trash              = ["delete"]                  # default: delete
rename-or-restore  = ["f2"]                      # default: f2
copy               = ["ctrl+c"]                  # default: ctrl+c
cut                = ["ctrl+x"]                  # default: ctrl+x
duplicate          = ["ctrl+d"]                  # default: ctrl+d
paste              = ["ctrl+v"]                  # default: ctrl+v
undo               = ["ctrl+z"]                  # default: ctrl+z
redo               = ["ctrl+y", "ctrl+shift+z"]  # default: ctrl+y or ctrl+shift+z
show-props         = ["alt+enter"]               # default: alt+enter
new-folder         = ["ctrl+shift+n"]            # default: ctrl+shift+n
new-file           = ["ctrl+alt+n"]              # default: ctrl+alt+n
parent-dir         = ["backspace"]               # default: backspace
hist-back          = ["alt+left"]                # default: alt+left
hist-forward       = ["alt+right"]               # default: alt+right
go-home            = []                          # default: 
path-edit          = ["ctrl+l"]                  # default: ctrl+l
connect-server     = ["ctrl+shift+s"]            # default: ctrl+shift+s
move-up            = ["up"]                      # default: up
move-down          = ["down"]                    # default: down
move-left          = ["left"]                    # default: left
move-right         = ["right"]                   # default: right
open-selected      = ["return"]                  # default: return
page-up            = ["pageup"]                  # default: pageup
page-down          = ["pagedown"]                # default: pagedown
first-item         = ["home"]                    # default: home
last-item          = ["end"]                     # default: end
start-search       = []                          # default: 
extend-up          = ["shift+up"]                # default: shift+up
extend-down        = ["shift+down"]              # default: shift+down
extend-left        = ["shift+left"]              # default: shift+left
extend-right       = ["shift+right"]             # default: shift+right
toggle-focused     = ["space"]                   # default: space
invert-selection   = []                          # default: 
toggle-hidden      = ["ctrl+h"]                  # default: ctrl+h
reload-places      = ["ctrl+r"]                  # default: ctrl+r
toggle-preview     = ["f9"]                      # default: f9
toggle-view        = ["ctrl+g"]                  # default: ctrl+g
cycle-sort         = []                          # default: 
zoom-in            = ["ctrl+="]                  # default: ctrl+=
zoom-out           = ["ctrl+-"]                  # default: ctrl+-
toggle-dual-pane   = ["ctrl+shift+d"]            # default: ctrl+shift+d
switch-pane        = ["tab"]                     # default: tab
copy-to-other-pane = ["f5"]                      # default: f5
move-to-other-pane = ["f6"]                      # default: f6
open-terminal      = ["f4"]                      # default: f4
