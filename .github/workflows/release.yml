name: Release

# Produces the artifacts install.sh downloads: tfm-{x86_64,aarch64}-linux.gz
# plus a .sha256 sidecar each. Video thumbnails use the SYSTEM ffmpeg (an
# optional runtime dep install.sh suggests), so nothing ffmpeg-shaped ships
# here. Tag a version to ship it:
#   git tag v1.0.0 && git push origin v1.0.0
# Version must match package.json (checked below) so --version never lies.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64
            arch: x86_64-linux
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            arch: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Version matches package.json
        run: test "v$(bun -e 'console.log(require("./package.json").version)')" = "${{ github.ref_name }}"

      # The patched opentui fork must sit BESIDE the checkout: package.json
      # depends on file:../opentui-fork/packages/core/dist. Its prebuilt dist is
      # committed on the branch named in opentui-fork.ref.
      - name: Fetch the opentui fork
        run: |
          url=$(sed -n 's/^url *= *//p' opentui-fork.ref | head -n 1)
          ref=$(sed -n 's/^ref *= *//p' opentui-fork.ref | head -n 1)
          git clone --depth 1 --single-branch --branch "$ref" "$url" ../opentui-fork

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Stage the fork's patched libopentui over the UNPATCHED npm platform
      # package, so the compiled binary embeds it. bun resolves the fork's dist
      # through its real path, so the compile looks the platform packages up in
      # the fork — point it at the ones installed here first. Fails loudly when
      # the fork ships no prebuilt lib for this runner's architecture.
      - name: Stage the patched libopentui
        run: |
          # bun resolves the file: dependency's dist through its real path, so
          # the compile resolves imports from the FORK's node_modules: link it
          # at ours instead of installing the fork's tree.
          ln -sfn "$(readlink -f node_modules)" ../opentui-fork/node_modules
          sh scripts/sync-opentui-lib.sh

      # Video thumbs (and their tests) need ffmpeg; the runners aren't
      # guaranteed to carry it and tfm no longer bundles one.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Check + test
        run: |
          bun run check
          bun run test

      - name: Compile
        run: bun build --compile --target=${{ matrix.target }} src/index.ts assets/icons/*.svg --outfile dist/tfm-${{ matrix.arch }}

      - name: Package + checksum
        run: |
          gzip -kf dist/tfm-${{ matrix.arch }}
          (cd dist && sha256sum tfm-${{ matrix.arch }}.gz > tfm-${{ matrix.arch }}.gz.sha256)
          # desktop entry sidecar (arch-independent, same bytes every build):
          # install.sh fetches it for pipe installs that carry no checkout
          cp assets/tfm.desktop dist/tfm.desktop
          (cd dist && sha256sum tfm.desktop > tfm.desktop.sha256)
          cp assets/icons/tfm.svg dist/tfm-icon.svg
          (cd dist && sha256sum tfm-icon.svg > tfm-icon.svg.sha256)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfm-${{ matrix.arch }}
          path: |
            dist/tfm-${{ matrix.arch }}.gz
            dist/tfm-${{ matrix.arch }}.gz.sha256
            dist/tfm.desktop
            dist/tfm.desktop.sha256
            dist/tfm-icon.svg
            dist/tfm-icon.svg.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums
        run: (cd dist && sha256sum -c *.sha256)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tfm-x86_64-linux.gz
            dist/tfm-x86_64-linux.gz.sha256
            dist/tfm-aarch64-linux.gz
            dist/tfm-aarch64-linux.gz.sha256
            dist/tfm.desktop
            dist/tfm.desktop.sha256
            dist/tfm-icon.svg
            dist/tfm-icon.svg.sha256
