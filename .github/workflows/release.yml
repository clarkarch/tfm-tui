name: Release

# Produces the artifacts install.sh downloads: tfm-{x86_64,aarch64}-linux.gz
# plus a .sha256 sidecar each (install.sh verifies when present and refuses
# to install when absent). Tag a version to ship it:
#   git tag v0.1.0-alpha.12 && git push origin v0.1.0-alpha.12
# Version must match package.json (checked below) so --version never lies.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64
            arch: x86_64-linux
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            arch: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Version matches package.json
        run: test "v$(bun -e 'console.log(require("./package.json").version)')" = "${{ github.ref_name }}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check + test
        run: |
          bun run check
          bun run test

      - name: Compile
        run: bun build --compile --target=${{ matrix.target }} src/index.ts assets/icons/*.svg --outfile dist/tfm-${{ matrix.arch }}

      - name: Package + checksum
        run: |
          gzip -kf dist/tfm-${{ matrix.arch }}
          (cd dist && sha256sum tfm-${{ matrix.arch }}.gz > tfm-${{ matrix.arch }}.gz.sha256)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfm-${{ matrix.arch }}
          path: |
            dist/tfm-${{ matrix.arch }}.gz
            dist/tfm-${{ matrix.arch }}.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify checksums
        run: (cd dist && sha256sum -c *.sha256)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tfm-x86_64-linux.gz
            dist/tfm-x86_64-linux.gz.sha256
            dist/tfm-aarch64-linux.gz
            dist/tfm-aarch64-linux.gz.sha256
